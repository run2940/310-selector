name: Update and deploy 310 Selector

on:
  push:
    branches: [main]
    paths:
      - "XQ/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "310-selector-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Import XQ CSV history
        if: github.event_name != 'schedule'
        run: python scripts/import_xq_data.py
      - name: Generate static website data
        if: github.event_name != 'schedule'
        run: python scripts/export_history.py --source-db data/stock_selector.db
      - name: Refresh stock futures underlyings
        run: python scripts/update_stock_futures.py
      - name: Save generated history and website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            git add data/stock_selector.db data/market_strength.csv site/data
          else
            git add site/data/stock_futures.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update generated selector data"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
