name: Update and deploy 310 Selector

on:
  push:
    branches: [main]
    paths:
      - "XQ/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/update-and-deploy.yml"
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "310-selector-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate and publish data from latest branch
        id: publish
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$TARGET_BRANCH"
            base="$(git rev-parse FETCH_HEAD)"
            worktree="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/stock-update.XXXXXX")"
            git worktree add --detach "$worktree" "$base"
            (
              cd "$worktree"
              if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
                python scripts/import_xq_data.py
                python scripts/export_history.py --source-db data/stock_selector.db
              fi
              python scripts/update_stock_futures.py
              if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
                targets=(data/history data/stock_selector.db data/market_strength.csv site/data)
              else
                targets=(site/data/stock_futures.json)
              fi
              for target in "${targets[@]}"; do
                if [ -e "$target" ] || git ls-files --error-unmatch -- "$target" >/dev/null 2>&1; then
                  git add -A -- "$target"
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "Update generated selector data"
              fi
            )
            if git -C "$worktree" push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              printf 'site_path=%s/site\n' "$worktree" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin "$TARGET_BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
              echo "::error::Push failed without a newer remote commit. Check repository write permissions and logs."
              exit 1
            fi
            echo "Remote branch changed during generation; retrying from latest data ($attempt/3)."
          done
          echo "::error::Repository kept changing. Please run the workflow again after uploads finish."
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.publish.outputs.site_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
